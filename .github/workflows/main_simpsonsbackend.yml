# Deploy Express API (backend/) to Azure Web App — SimpsonsBackEnd
# https://github.com/Azure/webapps-deploy

name: Build and deploy Node.js app to Azure Web App - SimpsonsBackEnd

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - ".github/workflows/main_simpsonsbackend.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v4
        with:
          node-version: "24.x"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: npm install
        run: npm ci --omit=dev

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: backend/

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_88F4A80B915D4771BD758238FD1B27C6 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_DB14476C3D954F1E8BF57F2BCBAF46FD }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_991F06AB66EF46C3A080CA8B1EE773CF }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: SimpsonsBackEnd
          slot-name: Production
          package: .
