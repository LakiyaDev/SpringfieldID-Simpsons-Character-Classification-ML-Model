# Deploy Next.js frontend to Azure Web App — SimpsonsFrontEnd
# Create the App Service in Azure Portal with this exact name (or update app-name below).
# Set Startup Command in Azure: npm start

name: Build and deploy Node.js app to Azure Web App - SimpsonsFrontEnd

on:
  push:
    branches:
      - main
    paths:
      - "frontend/**"
      - ".github/workflows/main_simpsonsfrontend.yml"
  workflow_dispatch:

env:
  NEXT_PUBLIC_API_URL: https://simpsonsbackend-hmgff0hac5dpcub3.southeastasia-01.azurewebsites.net

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v4
        with:
          node-version: "24.x"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: npm install and build
        env:
          NEXT_PUBLIC_API_URL: ${{ env.NEXT_PUBLIC_API_URL }}
        run: |
          npm ci
          npm run build
          npm prune --omit=dev

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: frontend/

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_88F4A80B915D4771BD758238FD1B27C6 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_DB14476C3D954F1E8BF57F2BCBAF46FD }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_991F06AB66EF46C3A080CA8B1EE773CF }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: SimpsonsFrontEnd
          slot-name: Production
          package: .
